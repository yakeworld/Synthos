  strategy: 使用 `pdfinfo` 或打开首页验证标题/作者，确认对应关系后再执行操作
  weight: 1.0
- id: REFE-003
  condition: 执行Bib清理任务 → 严格遵循“清理bib无效条目 → 删除.tex残留引用
