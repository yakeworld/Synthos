  weight: 1.0
- id: REFE-004
  condition: PDF在子目录已存在且需根目录访问
  strategy: 创建符号链接（symlink）指向原文件，避免复制导致的双份数据漂移
  weight: 1.0
- id: REFE-005
  condition: 清理或迁移操作完成后
  strategy: 必须执行 `pdflatex` 编译验证，确保 0 error 且 0 undefined reference 方可视为完成
  weight: 1.0
