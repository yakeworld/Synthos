genes:
- id: KGB-001
  condition: 查询成本敏感或日常高频查询
  strategy: 优先使用 quick 模式（<1s），仅当需要深度探索时才启用 deep 模式
  weight: 1.0
- id: KGB-002
  condition: 面对多词或中英混合查询导致词袋匹配失效
  strategy: 采用 jieba 分词 + TF-IDF 全文检索，并与图结果融合（图权重更高）
  weight: 1.0
- id: KGB-003
  condition: 实体解析存在歧义或匹配不确定 → 执行 精确→子串→分词→反向
  strategy: 模糊 五级降级评分策略，逐级回退以避免误投
  weight: 1.0
- id: KGB-004
  condition: 查询结果噪声过大或数据量爆炸
  strategy: 限制输出数量（≤20）并采用 BFS 分层展开，先展示 depth=1 再按需展开 depth=2
  weight: 1.0
- id: KGB-005
  condition: 需要调用重型依赖（如 sentence-transformers/torch）进行向量搜索
  strategy: 避免在 Agent venv 中加载，改用系统 Python 的 TF-IDF 或纯文本分词替代
  weight: 1.0
- id: KGB-006
  condition: 调用图谱 API 时出现属性错误（AttributeError）
  strategy: 确认 `resolve_entity` 位于 `QueryEngine` 而非 `KnowledgeGraph`，且 `find_related`
    返回值为 3 元组
  weight: 1.0
