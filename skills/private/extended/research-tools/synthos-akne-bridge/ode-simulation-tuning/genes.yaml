- id: ODE-001
  condition: 测量基线前
  strategy: 必须在 D=0 条件下运行 1000+ 步以确保系统达到均衡，否则基线数据无效
  weight: 1.0
- id: ODE-002
  condition: 执行无耦合消融测试 → 必须移除所有耦合机制（如 flow-stress、E
  strategy: tau、产生项），仅保留稳态衰减和直接加载，以防消融缺口虚高
  weight: 1.0
- id: ODE-003
  condition: 在新领域进行参数调优
  strategy: 从 P140 已验证的基线参数出发，每次仅调整一个参数，禁止对八维参数空间进行盲目网格扫描
  weight: 1.0
- id: ODE-004
  condition: 设计耦合项方程
  strategy: 必须采用加性且基线锚定的形式（如 `eps*(X-X_hp)`），严禁使用乘性正反馈项以避免变量冲顶或失真
  weight: 1.0
- id: ODE-005
  condition: 验证模型成功标准
  strategy: 九项指标（R²、AUC、ablation 等）须同时达标，若任一项失败则退回首个失守步骤重新调优
  weight: 1.0
- id: ODE-006
  condition: 计算 MAPE 指标
  strategy: 应使用曲线拟合残差法（`|y_fit - y_data| / y_data`）而非相对变化法，以准确反映拟合精度
  weight: 1.0
- id: ODE-007
  condition: 处理非线性耦合导致的基线动态过强
  strategy: 优先使用线性形式 `R*(1-S)` 替代非线性形式 `R*S*(1-S)`，以稳定基线动态
  weight: 1.0
