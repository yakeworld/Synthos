genes:
- id: DATA-001
  condition: 调用 OpenML API 获取数据集列表时
  strategy: 必须使用 `limit=50` 配合 `offset` 进行分页，严禁单次请求 `limit > 200` 以防 JSON 截断
  weight: 1.0
- id: DATA-002
  condition: 解析 OpenML API 返回的质量指标数值时
  strategy: 必须将字符串类型（如 `"684.0"`）转换为 `float`，不可直接按整数或原生数值处理
  weight: 1.0
- id: DATA-003
  condition: 验证 GitHub 镜像或远程文件可用性时
  strategy: 必须检查文件首行内容（如 `head -1`）以识别 404 HTML 页面，不可仅依赖 HTTP 200 状态码
  weight: 1.0
- id: DATA-004
  condition: 在 OpenML 中执行数据集搜索时
  strategy: 必须使用 `/api/v1/json/data/list/` 接口进行过滤，避免使用无效的 `/tag/` 或 `/name/` 专用端点
  weight: 1.0
- id: DATA-005
  condition: 所有公开数据源（UCI/GitHub/HF等）均返回 404 或不可用时
  strategy: 依据已知 Schema 和统计特征生成固定种子的合成数据集，并明确标注其为合成数据
  weight: 1.0
- id: DATA-006
  condition: 解析 OpenML API 响应结构时
  strategy: 必须从 `data.dataset` 数组中提取数据，并使用 `did` 字段作为唯一标识符，而非 `data.data` 或 `id`
  weight: 1.0
