genes:
- id: REPO-001
  condition: 遇到 Git 认证或远程连接故障
  strategy: 优先执行 `git config --list --show-origin` 溯源配置来源，再下结论
  weight: 1.0
- id: REPO-002
  condition: 全局 `~/.gitconfig` 存在 `credential.helper` 或 `insteadOf` 配置
  strategy: 检查其是否覆盖 Repo 级 `gh auth` 设置，必要时执行 `git config --global --unset` 移除冲突项
  weight: 1.0
- id: REPO-003
  condition: '`gh auth status` 显示已登录但 `gh pr create` 报错'
  strategy: 检查 PAT Scope，确保包含 `repo` 和 `write:repository` 权限，否则重建 Classic PAT
  weight: 1.0
- id: REPO-004
  condition: '`ssh -vT git@github.com` 返回 "Permission denied (publickey)" → 确认 SSH
    Key 已正确注册到 GitHub Settings'
  strategy: SSH keys
  weight: 1.0
- id: REPO-005
  condition: 在 NFS 挂载点（如 `/mnt/nfs`）执行文件遍历或统计
  strategy: 使用 `timeout` 限制执行时间并采用浅层命令，避免 `os.walk` 或 `du` 导致 300s 超时
  weight: 1.0
- id: REPO-006
  condition: 调试 Git 凭据问题
  strategy: 组合使用 `grep credential`、`gh auth status` 及 `gh pr create` 测试命令以定位具体故障点
  weight: 1.0
