genes:
- id: CONV-001
  condition: 候选记忆无法回答“生长方向/框架维度/发酵潜力”三问
  strategy: 标记为低优先级用于排序而非立即删除，防止误删潜在高价值信息
  weight: 1.0
- id: CONV-002
  condition: 记忆内容涉及已完成的具体任务（如 PR 合并、批次完成）
  strategy: 不写入长期记忆，转而依赖 session_search 检索，避免记忆噪音
  weight: 1.0
- id: CONV-003
  condition: 记忆条目采用指令式语气（如 "Always use..."）
  strategy: 强制转换为陈述式事实描述（如 "User prefers..."），防止被误解为硬规则
  weight: 1.0
- id: CONV-004
  condition: 记忆库容量使用率超过 80%
  strategy: 触发主动清理机制，按价值排序删除低优先级项，确保整批操作不被拒绝
  weight: 1.0
- id: CONV-005
  condition: 执行记忆更新操作时 → 严格遵循 remove→replace
  strategy: add 的原子顺序，确保 all-or-nothing 一致性，避免中间状态导致失败
  weight: 1.0
- id: CONV-006
  condition: 待写入的记忆与 CONSTITUTION 宪法条款冲突
  strategy: 立即拦截并拒绝写入，确保记忆系统不覆写核心宪法护栏
  weight: 1.0
- id: CONV-007
  condition: 存在多条分散的同类记忆项（如同项目不同路径）
  strategy: 合并为单条高信号记忆，并使用连接符替代完整句子以压缩空间
  weight: 1.0
- id: CONV-008
  condition: 记忆匹配因 Unicode 差异（如箭头符号）或空格导致失败
  strategy: 改用短关键字符串进行匹配重试，提高操作鲁棒性
  weight: 1.0
