genes:
- id: OPEN-001
  condition: 报告分类任务结果时
  strategy: 必须同时提供 OpenML 数据库基准对比，明确说明方法框架差异（如 Weka vs sklearn）及排名位置
  weight: 1.0
- id: OPEN-002
  condition: 处理 OpenML API 返回的评估指标时
  strategy: 需将字符串类型的 value 转换为浮点数，并过滤掉 accuracy 或 f1 为 0 的无效 runs
  weight: 1.0
- id: OPEN-003
  condition: 面对大量 OpenML run 详情查询需求时
  strategy: 采用批量获取列表后过滤再逐个查询详情的策略，以避免因逐个查询导致的速率限制和超时
  weight: 1.0
- id: OPEN-004
  condition: 分析 F1 分数差距且涉及不同框架（如 Weka vs sklearn）时
  strategy: 优先归因于模型实现差异（超参、剪枝、分裂规则）而非数据预处理，避免错误归因
  weight: 1.0
- id: OPEN-005
  condition: 处理不平衡数据且不平衡程度不严重（如 268:500）时
  strategy: 避免使用 SMOTE 等过采样技术，以防引入噪声抵消潜在收益
  weight: 1.0
- id: OPEN-006
  condition: 使用树模型或贝叶斯模型进行预测时
  strategy: 跳过特征标准化步骤，因为此类模型对特征尺度不敏感且标准化可能无益
  weight: 1.0
- id: OPEN-007
  condition: 调用 OpenML API 获取大量数据（如 >500 条）时
  strategy: 设置 limit 分批处理（如 limit=500）并配置超时控制（--max-time 30）以防止请求超时
  weight: 1.0
