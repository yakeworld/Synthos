genes:
- id: KNOW-001
  condition: 审计发现核心文献缺失 (P0)
  strategy: 立即执行 `notebooklm source add` 补充关键来源，优先保障核心项目完整性
  weight: 1.0
- id: KNOW-002
  condition: 遇到 NotebookLM 认证失败且存在本地 profile 数据
  strategy: 确认 CLI 仅读取默认路径 `~/.notebooklm/storage-state.json`，必须通过 `notebooklm login`
    重新建立会话，忽略自定义 profile 路径
  weight: 1.0
- id: KNOW-003
  condition: 需要拆分或重组知识库主题
  strategy: 禁止尝试迁移旧源，应新建聚焦主题库并填充新文献，同时将旧库重命名为 "Archive - [原名]" 进行归档
  weight: 1.0
- id: KNOW-004
  condition: 需要建立跨笔记本的概念关联
  strategy: 创建映射文档 (Markdown) 解释关系，并将其作为 Source 同时添加到两个相关笔记本中以实现逻辑桥接
  weight: 1.0
- id: KNOW-005
  condition: 执行 Source 重命名或删除操作
  strategy: 使用 12 字符 UUID 前缀作为标识符，并通过 `echo "y" |` 管道自动确认，避免交互式阻塞
  weight: 1.0
- id: KNOW-006
  condition: 处理非标准命名的 PDF 来源 (P1)
  strategy: 识别以数字或日期开头的文件名，限期执行重命名操作以符合标准命名规范
  weight: 1.0
- id: KNOW-007
  condition: 知识库出现大量未分类或重复笔记本 (P2)
  strategy: 执行分类整理与去重，将超过阈值的 "其他" 类笔记本进行归类，删除重复项以维持库结构清晰
  weight: 1.0
