genes:
- id: SK-001
  condition: 当 `ampy run` (raw REPL) 协议不可用或失败时
  strategy: 直接通过 Python 调用 `ampy.pyboard.Pyboard` 底层 API 实现代码执行与文件传输
  weight: 1.0
- id: SK-002
  condition: 当需要重启 K230 设备且希望实现全自动化时
  strategy: 通过串口发送 `import machine; machine.reset()` 执行软重启，避免依赖物理拔插
  weight: 1.0
- id: SK-003
  condition: 当配置 GPIO 引脚且固件版本未知时
  strategy: 检查 `/revision.txt` 确认固件类型，RT-Smart 固件需显式调用 FPIOA 映射，标准 CanMV 固件则直接使用 `machine.Pin`
  weight: 1.0
- id: SK-004
  condition: 当不同 K230 板型按键 GPIO 编号不一致时
  strategy: 通过 `os.uname()[-1]` 检测具体板型，动态分配对应的 GPIO 号及电平逻辑
  weight: 1.0
- id: SK-005
  condition: 当主循环处于 idle 状态且需检测短按按键时
  strategy: 避免使用超过 1ms 的 `time.sleep`，保持微秒级高频轮询以防止错过短按事件
  weight: 1.0
- id: SK-006
  condition: 当进行主循环重构或分模块开发时
  strategy: '严格保持 `while True: main(); time.sleep(1)` 的无限重启结构，确保 GPIO 异常被捕获并打印而非静默吞掉'
  weight: 1.0
- id: SK-007
  condition: 当初始化推理模式 (`inference_mode_start`) 时
  strategy: 必须同时设置 `state.current_mode = "inference"` 和 `state.is_running = True`，否则主循环无法进入正确分支
  weight: 1.0
