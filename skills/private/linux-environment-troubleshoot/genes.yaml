genes:
- id: LINU-001
  condition: 报错 "No space left on device" 但磁盘空间充足
  strategy: 优先检查并清除残留的锁文件（如 MiKTeX lock）及损坏日志，而非重装软件
  weight: 1.0
- id: LINU-002
  condition: Python venv 隔离失效或包安装位置错误
  strategy: 确保 `pyvenv.cfg` 中 `include-system-site-packages = false`，并强制使用 venv 内的
    Python 解释器执行 pip 安装
  weight: 1.0
- id: LINU-003
  condition: 使用 `uv pip install` 导致包未进入 venv
  strategy: 避免使用 uv 进行 venv 内包管理，改用 venv 自带的 pip 以遵循 PEP 668 隔离规范
  weight: 1.0
- id: LINU-004
  condition: 执行命令前需验证可执行文件有效性
  strategy: 使用 `file` 命令确认 `which` 返回的路径是有效的 ELF 二进制文件而非 broken symlink
  weight: 1.0
- id: LINU-005
  condition: 在 Debian/Ubuntu 上建立反向 Shell 失败
  strategy: 因 OpenBSD nc 不支持 `-e`/`-k` 参数，必须使用 ncat（nmap 提供）并配合 tmux 持久化会话
  weight: 1.0
- id: LINU-006
  condition: dpkg/apt 包管理器中断或锁死
  strategy: 执行 `sudo dpkg --configure -a` 修复中断状态，并清除 `/var/lib/dpkg/lock*` 等锁文件后重试
  weight: 1.0
- id: LINU-007
  condition: 长期运行的后台服务（如反向 Shell）会话丢失
  strategy: 将 tmux socket 路径指定在用户主目录（`~/.tmux-*`）而非 `/tmp`，以防被系统 tmpfiles 清理
  weight: 1.0
