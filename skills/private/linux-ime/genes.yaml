genes:
- id: LINU-001
  condition: 环境变量配置冲突
  strategy: 按 `/etc/X11/xinit/xinput.d/` > `/etc/environment.d/` > `~/.bashrc` 的优先级顺序排查，优先修正高优先级文件中的旧值
  weight: 1.0
- id: LINU-002
  condition: 系统安装 fcitx5 但应用无法输入
  strategy: 将 `GTK_IM_MODULE`、`QT_IM_MODULE` 和 `XMODIFIERS` 统一修正为 `fcitx5`，并删除指向 fcitx4
    的残留配置
  weight: 1.0
- id: LINU-003
  condition: 使用 Snap 版 Firefox/Chromium 且环境变量无效
  strategy: 识别 Snap 硬编码 ibus 特性，通过安装 deb 版本或修改应用内部配置（如 `about:config`）绕过环境变量限制
  weight: 1.0
- id: LINU-004
  condition: 在 pty/Tmux 虚拟终端中 IME 失效
  strategy: 识别无 X11/Wayland 会话的设计限制，改用 GUI 终端输入或通过文件写入方式处理中文内容
  weight: 1.0
- id: LINU-005
  condition: 切换输入法框架（fcitx5 ↔ ibus）后配置不生效
  strategy: 必须删除 `/etc/X11/xinit/xinput.d/` 下旧框架的配置文件，创建新框架配置并注销/重启会话
  weight: 1.0
- id: LINU-006
  condition: ibus-libpinyin 候选延迟高
  strategy: 禁用网络候选功能并删除云端词频数据文件（`network.bin`/`opengram.dbin`），重启 ibus-daemon 以恢复性能
  weight: 1.0
- id: LINU-007
  condition: 修改环境变量后运行中的应用无响应
  strategy: 识别 GTK/Qt 应用启动时加载 IM 模块的特性，完全关闭并重启应用进程以应用新配置
  weight: 1.0
