  condition: 飞书 MEDIA 附件发送后用户未收到且无报错
  strategy: 检查文件大小是否超过 10MB，若超限则使用 Ghostscript 压缩至 10MB 以下后重发
  weight: 1.0
- id: FEIS-005
  condition: 发送文件附件前
  strategy: 必须执行 `ls -la` 验证文件路径真实存在，避免路径错误导致静默失败
  weight: 1.0
