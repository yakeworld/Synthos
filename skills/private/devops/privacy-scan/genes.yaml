genes:
- id: PRIV-001
  condition: 执行 Git 推送操作前
  strategy: 必须触发 pre-push 钩子进行敏感信息（API Key、Token、密码等）扫描
  weight: 1.0
- id: PRIV-002
  condition: 发现已知泄露凭证或新敏感数据
  strategy: 将其加入 `KNOWN_SECRETS` 黑名单数组以增强后续拦截能力
  weight: 1.0
- id: PRIV-003
  condition: 确认代码库中绝对不含敏感信息且需紧急推送
  strategy: 使用 `git push --no-verify` 跳过扫描，但需承担泄露风险
  weight: 1.0
- id: PRIV-004
  condition: 检测到 .gitignore 注释与实际排除规则矛盾
  strategy: 执行 `git rm --cached` 移除误追踪文件并修正规则以直接排除整个私有目录
  weight: 1.0
- id: PRIV-005
  condition: 发生历史提交敏感信息泄露
  strategy: 使用 `git-filter-repo` 重写历史提交清除数据，并立即轮换本地存储的原始凭证
  weight: 1.0
- id: PRIV-006
  condition: 验证扫描结果或清理效果
  strategy: 采用 `git ls-tree` 等命令进行二次验证，确保敏感文件确实未被追踪或已清除
  weight: 1.0
- id: PRIV-007
  condition: 处理扫描异常或失败场景
  strategy: 错误信息必须包含具体上下文和明确的恢复建议，确保操作可复现且可追溯
  weight: 1.0
