genes:
- id: MINE-001
  condition: 开始配置前
  strategy: 必须询问用户关于服务器名称、种子、难度、游戏模式、在线模式、玩家数量、内存分配、视距、PvP、白名单及备份策略的偏好，若用户未指定则使用合理默认值
  weight: 1.0
- id: MINE-002
  condition: 部署 Mod 包服务器
  strategy: 必须设置 `allow-flight=true` 以防止拥有飞行能力的 Mod 物品或坐骑导致玩家被踢出
  weight: 1.0
- id: MINE-003
  condition: 处理 Mod 包服务器性能
  strategy: 必须将 `max-tick-time` 设置为 180000 或更高，以容纳 Mod 包在生成世界或加载区块时的长 Tick 时间
  weight: 1.0
- id: MINE-004
  condition: 配置 JVM 内存参数
  strategy: 根据 Mod 数量（100-200 个需 6-12GB，200-350+ 个需 12-24GB）分配 RAM，并确保系统保留至少 8GB 空闲内存
  weight: 1.0
- id: MINE-005
  condition: 配置网络与认证模式
  strategy: 若设置 `online-mode=false`（局域网/非正版），必须同时设置 `enforce-secure-profile=false`
    以避免客户端连接被拒绝
  weight: 1.0
- id: MINE-006
  condition: 创建启动脚本
  strategy: 必须编写独立的启动脚本引用 `user_jvm_args.txt` 和 Loader 参数，避免使用 Mod 包自带的 `startserver.sh`
    以防其内置的自动重启循环干扰
  weight: 1.0
- id: MINE-007
  condition: 设置自动化备份
  strategy: 必须创建备份脚本定期压缩 `world` 文件夹，并配置 Cron 任务限制最大备份数量（如 24 个）以自动清理旧备份
  weight: 1.0
