genes:
- id: POKE-001
  condition: 执行移动或导航操作
  strategy: 每 2-4 步必须截图并使用视觉分析验证位置，严禁仅依赖 RAM 状态数据
  weight: 1.0
- id: POKE-002
  condition: 遭遇对话框或文本滚动
  strategy: 使用 `hold_b` 加速文本显示后按 `a` 推进，若卡住则手动组合按键并截图验证
  weight: 1.0
- id: POKE-003
  condition: 通过门或楼梯进行地图切换
  strategy: 在动作序列末尾添加 2-3 个 `wait_60` 以等待过渡完成，防止读取到过时的位置信息
  weight: 1.0
- id: POKE-004
  condition: 从建筑物出口走出
  strategy: 先向左或右横向移动 2 格避开门口，再执行预定方向的移动，防止立即走回室内
  weight: 1.0
- id: POKE-005
  condition: 遇到向北被悬崖（Ledge）阻挡
  strategy: 利用视觉模型识别缺口方向，仅允许向南跳跃，需横向寻找绕行路径
  weight: 1.0
- id: POKE-006
  condition: 面临战斗决策且无类型优势
  strategy: 优先使用最强 STAB（本系）招式，若 HP 过低则切换宝可梦或使用药水
  weight: 1.0
- id: POKE-007
  condition: 执行高风险操作（道馆战、新区域、不确定动作）前
  strategy: 必须使用描述性名称（如 `before_brock`）保存游戏状态
  weight: 1.0
- id: POKE-008
  condition: 连续 3 次尝试移动失败或陷入僵局
  strategy: 立即停止随机尝试，截图重新评估环境并更新记忆中的 `PKM:STUCK` 记录
  weight: 1.0
