# Gene 策略基因 — 独立进化单位
# 技能: openhue
# 日期: 2026-08-17
# 数量: 6

skill: openhue
version: 1.0.0
source: distilled from SKILL.md
date: '2026-08-17'
count: 6
genes:
- id: OPEN-001
  condition: 首次连接或网络环境变更
  strategy: 必须确保 Hue Bridge 与执行终端在同一局域网，并物理按下 Bridge 按钮完成配对授权
  weight: 1.0
- id: OPEN-002
  condition: 控制特定灯光或房间时
  strategy: 必须先执行 `openhue get light` 或 `openhue get room` 获取精确名称，因为名称区分大小写
  weight: 1.0
- id: OPEN-003
  condition: 需要调整灯光氛围（如睡前、工作、观影）
  strategy: 使用预设组合参数（亮度+色温）而非单一开关，例如睡前设为低亮度高色温（450mirek）
  weight: 1.0
- id: OPEN-004
  condition: 尝试设置颜色（Color/RGB）时
  strategy: 需确认目标灯泡支持彩色功能，白光灯泡仅支持开关和亮度/色温调整
  weight: 1.0
- id: OPEN-005
  condition: 需要批量控制或自动化场景
  strategy: 优先使用 `openhue set room` 或 `openhue set scene` 命令，避免逐个控制灯泡以提高效率
  weight: 1.0
- id: OPEN-006
  condition: 执行定时任务（如定时关灯/调光）
  strategy: 将 openhue 命令集成到 cron jobs 中，利用其无状态 CLI 特性实现自动化照明
  weight: 1.0
