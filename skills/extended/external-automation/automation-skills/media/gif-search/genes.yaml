genes:
- id: GIF-001
  condition: 需要获取轻量级预览或聊天场景下的 GIF
  strategy: 优先使用 `tinygif` 或 `nanogif` 格式以减小文件体积
  weight: 1.0
- id: GIF-002
  condition: 执行 Tenor API 搜索请求
  strategy: 必须将查询词中的空格编码为 `+` 并对特殊字符进行 URL 编码
  weight: 1.0
- id: GIF-003
  condition: 需要下载特定 GIF 文件到本地
  strategy: 先通过 API 获取 `media_formats.gif.url`，再使用 `curl -sL` 下载该 URL
  weight: 1.0
- id: GIF-004
  condition: 需要获取 GIF 的完整元数据（标题、尺寸等）
  strategy: 使用 `jq` 提取 `.results[]` 中的 `title`、`url` 及 `dims` 字段
  weight: 1.0
- id: GIF-005
  condition: 需要控制搜索结果的数量或内容安全级别
  strategy: 在 API 请求中显式设置 `limit` (1-50) 和 `contentfilter` 参数
  weight: 1.0
- id: GIF-006
  condition: 需要在 Markdown 中直接引用 GIF
  strategy: 直接使用 API 返回的 GIF URL 嵌入 `![alt](url)` 语法，无需本地下载
  weight: 1.0
