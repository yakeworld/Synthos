# Gene 策略基因 — 独立进化单位
# 技能: codex
# 日期: 2026-08-17
# 数量: 7

skill: codex
version: 1.0.0
source: distilled from SKILL.md
date: '2026-08-17'
count: 7
genes:
- id: CODE-001
  condition: 复杂编码任务（多文件/多步骤）
  strategy: 优先使用 Codex CLI 而非 OpenCode，仅极轻量脚本使用 OpenCode
  weight: 1.0
- id: CODE-002
  condition: 通过 tmux 交互发送指令
  strategy: 指令文本与 Enter 键必须分两次独立调用 `send-keys` 发送，避免指令卡住
  weight: 1.0
- id: CODE-003
  condition: 需要并行处理多个独立任务
  strategy: 利用 `-p <profile>` 切换不同节点配置，将任务分配到不同后台进程以实现多节点负载
  weight: 1.0
- id: CODE-004
  condition: 在非 Git 目录执行 Codex
  strategy: 必须通过 `git init` 创建临时仓库或进入现有仓库，否则 Codex 拒绝运行
  weight: 1.0
- id: CODE-005
  condition: 在 Cron 或无 PTY 脚本环境中执行
  strategy: 使用 `codex exec` 并将 Prompt 作为 CLI 参数传递，无需 PTY 支持
  weight: 1.0
- id: CODE-006
  condition: 执行高风险或批量自动化任务
  strategy: 使用 `--yolo` 模式以跳过沙箱和审批，但需确保任务可信且环境隔离
  weight: 1.0
- id: CODE-007
  condition: 配置模型供应商
  strategy: 仅支持 OpenAI Responses API (`wire_api = "responses"`)，避免使用仅支持 Chat Completions
    的供应商
  weight: 1.0
