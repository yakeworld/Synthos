genes:
- id: CITA-001
  condition: 当DOI验证返回404且Crossref与Semantic Scholar均无匹配时
  strategy: 判定为完全虚构文献，必须寻找替代文献而非尝试修复
  weight: 1.0
- id: CITA-002
  condition: 当DOI验证返回404但Semantic Scholar找到不同DOI时
  strategy: 判定为DOI篡改，需修复DOI及元数据以匹配真实文献
  weight: 1.0
- id: CITA-003
  condition: 当参考文献为`@misc`类型的数据集条目时
  strategy: 应替换为引入或描述该数据集的正式论文（`@article`/`@inproceedings`）以提升规范性
  weight: 1.0
- id: CITA-004
  condition: 当进入Phase 2语义比对阶段时
  strategy: 必须提取引用语境并阅读PDF全文，通过比对标题、作者、年份及内容支撑度来验证引用得当性
  weight: 1.0
- id: CITA-005
  condition: 当PDF存在且DOI真实时
  strategy: 必须执行WITHDRAWN检测及PDF标题与BibTeX标题的一致性校验，以排除撤稿论文或下载串流错误
  weight: 1.0
- id: CITA-006
  condition: 当执行Phase 3全面性检查时
  strategy: 需基于主题词独立检索高引文献，对比现有引用列表以识别并补充关键遗漏文献
  weight: 1.0
- id: CITA-007
  condition: 当修改Bib文件或删除虚假引用后
  strategy: 必须执行D10a回归检查，确保Tex文件中的引用键与Bib条目一致，防止产生孤儿引用
  weight: 1.0
