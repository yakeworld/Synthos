genes:
- id: CODE-001
  condition: 执行代码库扫描前
  strategy: 必须使用 `--folders-to-skip` 排除 `.git`、`node_modules`、`venv` 等依赖及构建目录，防止扫描挂起或耗时过长
  weight: 1.0
- id: CODE-002
  condition: 需要获取整体代码规模概览
  strategy: 优先使用 `--format=summary` 格式输出，以获取语言分布、文件数及代码/注释行数的汇总表格
  weight: 1.0
- id: CODE-003
  condition: 仅需分析特定技术栈或语言
  strategy: 使用 `--suffix` 参数指定文件扩展名（如 `py`, `yaml`），以过滤无关文件并提升扫描效率
  weight: 1.0
- id: CODE-004
  condition: 面对大型 Monorepo 或超大规模仓库
  strategy: 避免全量扫描，应结合 `--suffix` 定向扫描特定语言，或分模块执行以控制资源消耗
  weight: 1.0
- id: CODE-005
  condition: 需要程序化处理或集成到自动化流程
  strategy: 使用 `--format=json` 输出结构化数据，以便后续脚本解析和计算
  weight: 1.0
- id: CODE-006
  condition: 解读 Markdown 或 JSON 文件的代码行数时
  strategy: 需知悉 pygount 将 Markdown 全计为注释（0 代码行）且对 JSON 计数保守，必要时用 `wc -l` 辅助校准
  weight: 1.0
- id: CODE-007
  condition: 需要识别代码库中的冗余或异常文件
  strategy: 关注输出中的伪语言标签（如 `__duplicate__` 重复文件、`__generated__` 生成文件、`__binary__` 二进制文件）以评估代码健康度
  weight: 1.0
