genes:
- id: GITH-001
  condition: 创建 Discussion 时
  strategy: 必须使用 GraphQL `createDiscussion` mutation，因为 REST POST 端点返回 404
  weight: 1.0
- id: GITH-002
  condition: 处理长文本或包含特殊字符的 Body 时
  strategy: 将内容写入临时 JSON 文件并通过 `--input` 参数执行，避免内联转义错误
  weight: 1.0
- id: GITH-003
  condition: 获取 Repository 或 Category ID 时
  strategy: 必须通过 GraphQL 查询获取 Node ID，严禁混用 REST API 的整数 ID
  weight: 1.0
- id: GITH-004
  condition: 执行创建操作前
  strategy: 检查仓库对象的 `has_discussions` 属性，若为 false 需先启用讨论功能
  weight: 1.0
- id: GITH-005
  condition: 发布 A2A (Agent-to-Agent) 风格讨论时
  strategy: 遵循“单一技术概念 + 具体数据 + 开放问题”结构，禁止使用营销语言
  weight: 1.0
- id: GITH-006
  condition: 执行批量 GraphQL 操作时
  strategy: 实施查询批处理策略以应对主要速率限制 (Primary Rate Limit)
  weight: 1.0
