- id: POWE-002
  condition: 多列网格布局计算元素位置
  strategy: 使用 `col = i % num_cols` 和 `row = i // num_cols` 均匀分布，严禁使用复杂条件链以防坐标重叠
  weight: 1.0
- id: POWE-003
  condition: 元素可能超出 LibreOffice 导出安全区 (12.8"×7.0")
  strategy: 对所有非零坐标和尺寸应用 0.92 系数缩放，确保元素位于安全区内
  weight: 1.0
- id: POWE-004
  condition: 用户提供了逐页设计规范文档
  strategy: 严格照搬规范内容，执行“不增、不减、不改、不挪”原则，禁止自行添加字段、移动元素或修改措辞
  weight: 1.0
- id: POWE-005
  condition: PPT 生成完毕准备交付
  strategy: 必须执行三步验证：L0.5 数据诚实门（核对硬事实）、布局数学检查（检测溢出/重叠）、规范一致性检查
  weight: 1.0
- id: POWE-006
  condition: 设计标志性成果或竞赛答辩页面
  strategy: 采用图像优先布局，图片占页面 40-60% 面积，并按原始比例等比缩放嵌入
  weight: 1.0
- id: POWE-007
  condition: 构建多页结构化 PPTX
  strategy: 定义统一配色方案及 helper 函数（如 header, mkcard），按页循环构建以保持风格一致
  weight: 1.0
- id: POWE-008
  condition: 需要调整 PPTX 页面顺序
  strategy: 直接操作 `prs.part._element` 中的 XML sldIdLst，因为 python-pptx 维护两套引用且保存时仅使用后者
