genes:
- id: NOTE-001
  condition: 执行知识提取或文献调研时
  strategy: 采用“一问一收”逐问法，每轮仅发送一个问题，依据答案动态决定下一个问题，严禁并行提问以防串话
  weight: 1.0
- id: NOTE-002
  condition: 调用 `notebooklm ask` 接口时
  strategy: 将超时阈值设置为至少 90 秒，以适配后端 30-60 秒的正常响应延迟
  weight: 1.0
- id: NOTE-003
  condition: 上传 PDF 文件前
  strategy: 使用 `pdftotext` 检查文本层，若字符数接近 0 则改用 arXiv URL 直传或提取文本后以 `--type text` 模式上传
  weight: 1.0
- id: NOTE-004
  condition: 发送包含中文的 Prompt 时
  strategy: 转换为纯英文 ASCII 字符发送，以规避 confusable Unicode 安全扫描拦截
  weight: 1.0
- id: NOTE-005
  condition: 上传 Markdown 或大文件时
  strategy: 剥离 YAML frontmatter 防止解析错误，且当内容超过 80KB 时改用 Python subprocess 而非 Shell
    参数传递
  weight: 1.0
- id: NOTE-006
  condition: 检测到 Google 服务网络不可达（如 `httpx.ConnectTimeout`）时
  strategy: 启动 Manual Fallback 方案，利用 `pdftotext` 提取全文进行人工五维质量评估
  weight: 1.0
- id: NOTE-007
  condition: 上传 PDF 后状态异常或静默失败时
  strategy: 立即执行 `source list` 验证状态，若为 error 则回退至文本提取上传，若列表为空则重试 2-3 次以刷新 API 缓存
  weight: 1.0
