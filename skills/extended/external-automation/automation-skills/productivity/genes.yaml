genes:
- id: PROD-001
  condition: 当需要执行生产力相关任务时
  strategy: 通过 Hermes 机制自动发现并直接调用对应的子技能名称，而非在父级技能中硬编码逻辑
  weight: 1.0
- id: PROD-002
  condition: 当接收用户请求时
  strategy: 严格校验输入参数（request/context）的类型、范围及格式完整性，确保符合 IO 契约
  weight: 1.0
- id: PROD-003
  condition: 当执行核心操作时
  strategy: 参考 scripts/ 或 references/ 目录下的资源，确保中间步骤、转换及计算的正确性
  weight: 1.0
- id: PROD-004
  condition: 当生成最终结果时
  strategy: 验证输出格式、内容、编码及命名是否符合预期契约，并保存结果
  weight: 1.0
- id: PROD-005
  condition: 当遇到空输入、极大值或异常场景时
  strategy: 执行边界验证，确保系统能处理极端情况并防止崩溃
  weight: 1.0
- id: PROD-006
  condition: 当操作失败时
  strategy: 提供包含上下文信息和明确恢复建议的错误指引，而非仅抛出通用错误
  weight: 1.0
- id: PROD-007
  condition: 当涉及代码执行或状态暴露时
  strategy: 拒绝执行未验证的任意代码，不暴露内部状态，确保安全性
  weight: 1.0
- id: PROD-008
  condition: 当进行技能迭代或测试时
  strategy: 以 Golden 集合（标准输入/预期输出/预期错误）为单一真理来源，确保所有改进通过可复现的测试
  weight: 1.0
