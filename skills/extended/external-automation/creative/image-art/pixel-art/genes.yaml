genes:
- id: PIXE-001
  condition: 用户意图模糊时
  strategy: 提供 4 个代表性预设选项进行澄清，避免一次性展示所有 14 种风格
  weight: 1.0
- id: PIXE-002
  condition: 用户已明确指定特定时代或风格时
  strategy: 跳过澄清步骤，直接匹配对应的预设参数
  weight: 1.0
- id: PIXE-003
  condition: 需要生成动画效果时
  strategy: 在风格确认后单独询问场景类型，且每轮对话中澄清调用不超过两次
  weight: 1.0
- id: PIXE-004
  condition: 执行像素化转换时
  strategy: 先降采样再量化，确保抖动算法与最终像素网格对齐以保留细节
  weight: 1.0
- id: PIXE-005
  condition: 源图像尺寸过小（<100px）时
  strategy: 先对源图像进行放大处理，防止在大块像素块下细节完全丢失
  weight: 1.0
- id: PIXE-006
  condition: 使用单色或双色调色板（如 mono_green）时
  strategy: 强制去饱和（color=0.0），避免平滑区域出现条纹伪影
  weight: 1.0
- id: PIXE-007
  condition: 处理高分辨率或大尺寸图像动画时
  strategy: 调整粒子密度或更换随机种子，以适配非标准 640x480 画布的视觉效果
  weight: 1.0
