- id: BAOY-001
  condition: 用户提供参考图片时
  strategy: 提取风格/色彩/场景特征转化为文本描述嵌入提示词，而非直接传入图像模型
  weight: 1.0
- id: BAOY-002
  condition: 需要保持角色一致性时
  strategy: 在 `characters.md` 中定义详细文本描述，并在每一页的生成提示词中内联嵌入
  weight: 1.0
- id: BAOY-003
  condition: 确定视觉风格时
  strategy: 优先匹配预设组合（如 ohmsha, wuxia），若未命中则根据内容信号自动推荐 Art+Tone 组合
  weight: 1.0
- id: BAOY-004
  condition: 处理多语言交互时
  strategy: 严格遵循“用户指定 > 对话语言 > 源内容语言”的优先级，所有交互及提示词均使用用户语言
  weight: 1.0
- id: BAOY-005
  condition: 执行生成流程时
  strategy: 在风格确认、大纲审查、提示词审查等关键节点设置条件性用户确认环节
  weight: 1.0
- id: BAOY-006
  condition: 处理部分生成需求时
  strategy: 支持仅生成分镜、仅生成提示词或仅重新生成指定页码，跳过无关步骤
  weight: 1.0
- id: BAOY-007
  condition: 管理输出文件时
  strategy: 采用 `comic/{topic-slug}/` 目录结构，冲突时追加时间戳，并保留参考图副本以溯源
  weight: 1.0
