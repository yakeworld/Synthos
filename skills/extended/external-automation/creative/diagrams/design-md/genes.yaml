# Gene 策略基因 — 独立进化单位
# 技能: design-md
# 日期: 2026-08-17
# 数量: 6

skill: design-md
version: 1.0.0
source: distilled from SKILL.md
date: '2026-08-17'
count: 6
genes:
- id: DESI-001
  condition: 当需要定义组件样式时
  strategy: 使用 `{token.path}` 引用而非硬编码值，确保设计令牌单一数据源
  weight: 1.0
- id: DESI-002
  condition: 当定义组件交互状态（如 hover/active）时
  strategy: 创建独立的同级组件键（如 `button-primary-hover`）而非嵌套属性
  weight: 1.0
- id: DESI-003
  condition: 当编写 YAML 中的颜色或负数维度值时
  strategy: 必须使用引号包裹字符串（如 `"#1A1C1E"`, `"-0.02em"`）以防止解析错误
  weight: 1.0
- id: DESI-004
  condition: 当组织 DESIGN.md 文档结构时
  strategy: 严格遵循 Overview 到 Do's and Don'ts 的规范章节顺序，禁止重复标题
  weight: 1.0
- id: DESI-005
  condition: 当完成 DESIGN.md 编写后
  strategy: 必须执行 `npx @google/design.md lint` 验证结构完整性及 WCAG 对比度合规性
  weight: 1.0
- id: DESI-006
  condition: 当用户需要跨项目一致性或代码集成时
  strategy: 使用 CLI 导出 Tailwind 或 W3C DTCG JSON 格式以对接现有开发工作流
  weight: 1.0
