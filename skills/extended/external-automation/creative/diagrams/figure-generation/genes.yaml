genes:
- id: FIGU-001
  condition: 当图表承载论证时 → 遵循“结论→证据→面板→出口
  strategy: 审核”五步契约，确保每张图承载单一可证伪主张，并通过“遮住面板”测试消除冗余。
  weight: 1.0
- id: FIGU-002
  condition: 当确定布局结构时
  strategy: 拒绝默认50/50等分，根据图特征（宽幅/高窄/密集）自适应选择全宽、堆叠或非对称布局，确保结果帧有一方明显主导。
  weight: 1.0
- id: FIGU-003
  condition: 当绘制架构图或流程图时
  strategy: 强制箭头严格水平或垂直，终点必须精确落在目标框AABB边缘（非“接近”），且多箭头同框时终点x坐标错开≥20px。
  weight: 1.0
- id: FIGU-004
  condition: 当展示≥3条曲线或色盲敏感场景时
  strategy: 必须采用颜色+形状/线型/标记的双编码策略，禁止仅用红绿或单一颜色区分数据系列。
  weight: 1.0
- id: FIGU-005
  condition: 当执行QA自动化检测时
  strategy: 警惕Regex盲区，若绘图逻辑被函数封装（如`def draw_box()`），需手动提取几何参数调用API验证，防止“虚假通过”。
  weight: 1.0
- id: FIGU-006
  condition: 当输出论文级图表时
  strategy: 严格执行出口契约，必须同时生成PNG(300DPI)、PDF和SVG三种格式，仅生成PDF或PNG视为违反契约。
  weight: 1.0
- id: FIGU-007
  condition: 当处理CJK文本在深色背景上时
  strategy: 采用双描技术（`draw.text`绘制两次，偏移1px）以增强边缘清晰度，避免文字模糊或融入背景。
  weight: 1.0
