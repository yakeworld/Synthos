genes:
- id: DC-001
  condition: 从2D投影坐标重建3D曲线时
  strategy: 必须在重建公式中显式包含螺旋中心偏移 (cx, cy)，避免曲线被错误锚定在数据质心
  weight: 1.0
- id: DC-002
  condition: 确定螺旋上点的解剖顺序时
  strategy: 必须使用最近邻路径 (nearest_neighbor_path) 展开角度，严禁使用 `np.argsort(theta)` 导致路径错乱
  weight: 1.0
- id: DC-003
  condition: 评估拟合质量时
  strategy: 必须交叉验证 RMSE、螺旋率参数 b 及视觉质量，不能仅凭曲线穿过点云判断参数正确性
  weight: 1.0
- id: DC-004
  condition: 处理从两端向中点标注的分段数据时
  strategy: 需将第二段反向并与第一段合并去重中点，以恢复完整弧长并防止短弧拟合出失真参数
  weight: 1.0
- id: DC-005
  condition: 在多脚本生成同一数据的不同视图时
  strategy: 必须执行交叉验证，确保所有脚本输出的 RMSE 和参数值一致，且无重复定义的拟合函数
  weight: 1.0
- id: DC-006
  condition: 撰写论文方法部分统计参数数量时
  strategy: 仅计算实际独立优化的参数（如8个），排除由 SVD 或质心固定的非独立变换参数
  weight: 1.0
- id: DC-007
  condition: 布局多标本复合图时
  strategy: 遵循“行=解剖代表/条件，列=标本/成像模态”的约定，并精细调整标题间距与标签位置以符合出版规范
  weight: 1.0
