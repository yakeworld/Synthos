genes:
- id: ASCI-001
  condition: 开始编码前
  strategy: 必须明确阐述创意概念（情绪、视觉故事、独特性），拒绝仅做提示词的字面转录
  weight: 1.0
- id: ASCI-002
  condition: 首次渲染输出
  strategy: 必须达到视觉惊艳标准，若显得平庸或像通用 AI 生成物则需重新构思而非修补
  weight: 1.0
- id: ASCI-003
  condition: 选择视觉效果时
  strategy: 将参考目录视为词汇表而非成品，必须组合、修改或发明新模式以超越现有预设
  weight: 1.0
- id: ASCI-004
  condition: 构建视频场景
  strategy: 优先保证整体美学连贯性（统一色温、字符调色板、运动语言），而非追求单场景的技术正确性
  weight: 1.0
- id: ASCI-005
  condition: 设计每一帧画面
  strategy: 采用多层网格构图并避免纯黑背景，确保画面具有密度、层次感和奖励性
  weight: 1.0
- id: ASCI-006
  condition: 处理多场景视频
  strategy: 为每个章节/场景差异化配置背景、字符调色板、颜色策略及粒子类型，禁止全片使用相同配置
  weight: 1.0
- id: ASCI-007
  condition: 项目交付前
  strategy: 主动添加至少一个用户未明确要求但能提升整体品质的视觉时刻（如特殊转场、色彩选择或效果）
  weight: 1.0
