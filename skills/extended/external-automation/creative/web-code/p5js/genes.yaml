  weight: 1.0
- id: PJS-004
  condition: 参数设计仅改变外观而非算法逻辑
  strategy: 参数应源于算法本身（如改变噪声八度或力场），而非仅调整几何尺寸（如粒子半径）
  weight: 1.0
- id: PJS-005
  condition: 编码前缺乏明确创作方向
  strategy: 先定义情绪、色彩世界、形状语言、运动词汇及独特之处，再进入技术设计与编码阶段
