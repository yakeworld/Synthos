- id: PJS-006
  condition: 处理海量粒子或高性能渲染需求
  strategy: 禁用帧事件系统、使用 Math.* 替代 p5 封装、采用 beginShape() 批量绘制或 pixelBuffer 直接写入以优化性能
  weight: 1.0
- id: PJS-007
  condition: 需要无头渲染或生产环境集成
  strategy: 使用 noLoop() 配合外部脚本控制帧前进，并采用实例模式避免全局变量污染
  weight: 1.0
