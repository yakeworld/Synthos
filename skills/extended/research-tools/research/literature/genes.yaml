  weight: 1.0
- id: LITE-004
  condition: 面对 API 接口变更或源可用性不确定时
  strategy: 运行 `literature diagnose` 进行三阶段实测（检索、DOI 解析、下载测试），不凭记忆假设源可用
  weight: 1.0
- id: LITE-005
  condition: 检索 ODE/PINN/CS 类论文时
  strategy: 必须同时搜索 S2、CrossRef 和 OpenAlex，因为 PubMed 对此类领域覆盖较差
  weight: 1.0
- id: LITE-006
  condition: 需要获取论文全文 PDF 时
  strategy: 优先通过 bban.top CDN 直连构建 URL (`https://sci.bban.top/pdf/{DOI}.pdf`) 下载，无需
    HTML 中转或代理
  weight: 1.0
- id: LITE-007
